version: "3.8"
services:
  broker-service:
    image: broker-service:latest
    build:
      context: .
      dockerfile: ./broker-service.dockerfile
    restart: always
    ports:
      - "8080:80"

  authentication-service:
    image: authentication-service:latest
    build:
      context: .
      dockerfile: ./authentication-service.dockerfile
    restart: always
    ports:
      - "8081:80"
    environment:
      DSN: "host=postgres port=5432 user=postgres password=password dbname=users sslmode=disable timezone=UTC connect_timeout=5"

  snippet-service:
    image: snippet-service:latest
    build:
      context: .
      dockerfile: ./snippet-service.dockerfile
    restart: always
    ports:
      - "8082:80"

  logger-service:
    image: logger-service:latest
    build:
      context: .
      dockerfile: ./logger-service.dockerfile
    restart: always

  comm-service:
    image: comm-service:latest
    build:
      context: .
      dockerfile: ./comm-service.dockerfile
    restart: always
    ports:
      - "8084:80"
    environment:
      MAIL_DOMAIN: localhost
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: none
      MAIL_PASSWORD: "snipptree@2024"
      MAIL_ENCRYPTION: "" 
      MAIL_NAME: "Snipp Tree"
      MAIL_ADDRESS: snipptree.dev@gmail.com

