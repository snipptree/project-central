apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipptree-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: snipptree.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: broker-service
            port:
              number: 80
  tls:
  - hosts:
    - snipptree.com
    secretName: snipptree-tls
